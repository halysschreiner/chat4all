services:
  # PostgreSQL - Banco de dados relacional
  postgres:
    image: postgres:16-alpine
    container_name: chat4all-postgres
    environment:
      POSTGRES_DB: chat4all
      POSTGRES_USER: chat4all_user
      POSTGRES_PASSWORD: chat4all_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - chat4all-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat4all_user -d chat4all"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Cache e sessões
  redis:
    image: redis:7-alpine
    container_name: chat4all-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - chat4all-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO - Object Storage para arquivos
  minio:
    image: minio/minio:latest
    container_name: chat4all-minio
    ports:
      - "9001:9000"  # API
      - "9002:9001"  # Console Web
    environment:
      MINIO_ROOT_USER: chat4all_admin
      MINIO_ROOT_PASSWORD: chat4all_minio_pass
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - chat4all-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Zookeeper - Coordenação do Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: chat4all-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - chat4all-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Gateway - REST to gRPC
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: chat4all-gateway
    ports:
      - "8000:80"
    environment:
      AUTH_SERVICE_HOST: api-service
      AUTH_SERVICE_PORT: 50051
      MESSAGE_SERVICE_HOST: api-service
      MESSAGE_SERVICE_PORT: 50051
      CONVERSATION_SERVICE_HOST: api-service
      CONVERSATION_SERVICE_PORT: 50051
      API_SERVICE_HOST: api-service
      API_SERVICE_PORT: 8080
    depends_on:
      - api-service
    networks:
      - chat4all-network

  # Kafka - Message Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: chat4all-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - chat4all-network
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5

  # API Service - Slim Framework
  api-service:
    build:
      context: .
      dockerfile: services/api-service/Dockerfile
    container_name: chat4all-api
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: chat4all
      DB_USER: chat4all_user
      DB_PASSWORD: chat4all_pass
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:9093
      JWT_SECRET: your-secret-key-change-in-production
      JWT_EXPIRATION: 3600
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: chat4all_admin
      MINIO_SECRET_KEY: chat4all_minio_pass
      MINIO_BUCKET: chat4all-files
      MINIO_USE_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - chat4all-network

  # Router Worker - Processa mensagens do Kafka
  router-worker:
    build:
      context: .
      dockerfile: workers/router-worker/Dockerfile
    # container_name: chat4all-router-worker  # Commented to allow scaling

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: chat4all
      DB_USER: chat4all_user
      DB_PASSWORD: chat4all_pass
      KAFKA_BROKERS: kafka:9093
      KAFKA_GROUP_ID: router-worker-group
      KAFKA_TOPIC: messages
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - chat4all-network

  # ============================================
  # WebSocket Worker - Notificações em tempo real
  # ============================================
  # Este worker gerencia conexões WebSocket para 
  # enviar notificações de status de mensagens
  # em tempo real para os clientes conectados.
  # ============================================
  websocket-worker:
    build:
      context: ./workers/websocket-worker
      dockerfile: Dockerfile
    container_name: chat4all-websocket
    ports:
      - "8081:8081"
    environment:
      WEBSOCKET_PORT: 8081
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: your-secret-key-change-in-production
      KAFKA_BROKERS: kafka:9093
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - chat4all-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8081"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Connector WhatsApp Mock - Simula integração com WhatsApp
  whatsapp-connector:
    build:
      context: .
      dockerfile: connectors/whatsapp-mock/Dockerfile
    # container_name: whatsapp-connector  # Commented to allow scaling
    # ports:  # Commented to allow scaling - connectors use Kafka internally
    #   - "9003:80"
    environment:
      KAFKA_BROKER: kafka:9093
      BACKEND_CALLBACK_URL: http://api-service:8080/v1/callbacks/whatsapp
      CONNECTOR_PORT: 80
    depends_on:
      kafka:
        condition: service_started
    networks:
      - chat4all-network

  # Connector Instagram Mock - Simula integração com Instagram
  instagram-connector:
    build:
      context: .
      dockerfile: connectors/instagram-mock/Dockerfile
    # container_name: instagram-connector  # Commented to allow scaling
    # ports:  # Commented to allow scaling - connectors use Kafka internally
    #   - "9004:80"
    environment:
      KAFKA_BROKER: kafka:9093
      BACKEND_CALLBACK_URL: http://api-service:8080/v1/callbacks/instagram
      CONNECTOR_PORT: 80
    depends_on:
      kafka:
        condition: service_started
    networks:
      - chat4all-network

  # Web Interface - Interface de usuário
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chat4all-web
    ports:
      - "4200:80"
    depends_on:
      - api-gateway
    networks:
      - chat4all-network

  # ===== MONITORING STACK =====
  
  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: chat4all-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - chat4all-network
    restart: unless-stopped

  # Grafana - Visualization and dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: chat4all-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - chat4all-network
    restart: unless-stopped

  # Metrics Exporter - Sample metrics generator
  metrics-exporter:
    image: python:3.11-slim
    container_name: chat4all-metrics-exporter
    ports:
      - "8001:8000"
    volumes:
      - ./monitoring/exporters/metrics-exporter.py:/app/metrics-exporter.py
    working_dir: /app
    command: python metrics-exporter.py
    networks:
      - chat4all-network
    restart: unless-stopped

networks:
  chat4all-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus-data:
  grafana-data:
