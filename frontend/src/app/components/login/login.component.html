<div class="login-container">
  <div class="login-card">
    <div class="logo">
      <h1>Chat4All</h1>
      <p>Connect with everyone</p>
    </div>

    <div class="api-selector">
      <label>Select API:</label>
      <select [(ngModel)]="selectedApi">
        <option *ngFor="let api of apis" [value]="api">{{ api }}</option>
      </select>
    </div>

    <div *ngIf="error" class="error-message">
      {{ error }}
    </div>

    <div *ngIf="successMessage" class="success-message">
      {{ successMessage }}
    </div>

    <form *ngIf="isLoginMode" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Email / Phone</label>
        <input type="text" formControlName="email" placeholder="Enter your email or phone" (input)="onEmailPhoneInput($event)">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" formControlName="password" placeholder="Enter your password">
      </div>
      <button type="submit" class="btn-primary" [disabled]="loginForm.invalid">Login</button>
    </form>

    <form *ngIf="!isLoginMode" [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Username</label>
        <input type="text" formControlName="username" placeholder="Choose a username">
      </div>
      <div class="form-group">
        <label>Email / Phone</label>
        <input type="text" formControlName="email" placeholder="Enter your email or phone" (input)="onEmailPhoneInput($event)">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" formControlName="password" placeholder="Choose a password">
      </div>
      <button type="submit" class="btn-primary" [disabled]="registerForm.invalid">Create Account</button>
    </form>

    <div class="toggle-mode">
      <p *ngIf="isLoginMode">Don't have an account? <a (click)="toggleMode()">Create one</a></p>
      <p *ngIf="!isLoginMode">Already have an account? <a (click)="toggleMode()">Login</a></p>
    </div>
  </div>
</div>
