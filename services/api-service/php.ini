; PHP Configuration for Chat4All API Service
; Configurações para upload e download de arquivos de até 2GB

; Upload de arquivos
upload_max_filesize = 2048M
post_max_size = 2048M
max_input_time = 3600
max_execution_time = 3600

; Memória
memory_limit = 512M

; Timeouts
default_socket_timeout = 3600

; Output buffering (desabilitar para streaming de arquivos grandes)
output_buffering = Off

; Logs
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
log_errors = On
error_log = /var/log/php_errors.log

; Timezone
date.timezone = America/Sao_Paulo
